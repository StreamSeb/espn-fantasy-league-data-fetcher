[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "espn-fantasy-league-data-fetcher"
version = "1.0.0"
description = "Export an ESPN fantasy football league's full history to SQLite, Postgres, CSV, Parquet and more"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["espn", "fantasy-football", "etl", "sqlite", "postgres", "parquet"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "espn-api>=0.44,<1",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
parquet  = ["pyarrow>=15"]
excel    = ["openpyxl>=3.1"]
duckdb   = ["duckdb>=0.10"]
all      = ["espn-fantasy-league-data-fetcher[postgres,parquet,excel,duckdb]"]
dev      = ["espn-fantasy-league-data-fetcher[all]", "pytest>=8", "ruff>=0.6"]

[project.scripts]
espn-fantasy = "espn_fantasy.cli:main"

[project.urls]
Homepage = "https://github.com/StreamSeb/espn-fantasy-league-data-fetcher"
Issues = "https://github.com/StreamSeb/espn-fantasy-league-data-fetcher/issues"

[tool.setuptools.packages.find]
include = ["espn_fantasy*"]

[tool.setuptools.package-data]
espn_fantasy = ["schema/*.sql", "env.example"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]
