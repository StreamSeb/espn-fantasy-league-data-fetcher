name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    services:
      postgres:
        # 15+ is required: the raw store relies on NULLS NOT DISTINCT.
        image: postgres:16
        env:
          POSTGRES_USER: ffl
          POSTGRES_PASSWORD: ffl
          POSTGRES_DB: ffl_scratch
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - run: pip install -e '.[dev]'

      - name: Lint
        run: ruff check .

      - name: Test
        # No ESPN credentials, so nothing here touches the network: the suite
        # runs against a fixture league and a scratch Postgres.
        env:
          FFL_TEST_DSN: postgresql://ffl:ffl@127.0.0.1:5432/ffl_scratch
        run: pytest -q

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No committed .env or credentials
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked; it holds ESPN session cookies"
            exit 1
          fi
          # ESPN's own cookie names, anywhere but the documentation that
          # explains where to find them.
          if git grep -nE '^(ESPN_S2|SWID)=.+' -- ':!.env.example'; then
            echo "::error::a real cookie value looks committed"
            exit 1
          fi
